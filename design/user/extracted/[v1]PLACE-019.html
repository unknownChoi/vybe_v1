<title>vybe · 주변 (Liquid Glass)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;background:#0a0a0d;font-family:'Pretendard',-apple-system,sans-serif}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
a{color:#B5FF60;text-decoration:none}
a:hover{color:#94CF51}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ngPulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.7);opacity:0}}
@keyframes ngHalo{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.55}50%{transform:translate(-50%,-50%) scale(1.14);opacity:.28}}
@keyframes ngLive{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.5}}
@keyframes ngShimmer{0%{background-position:-180% 0}100%{background-position:180% 0}}
@keyframes ngRecHalo{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.22);opacity:.16}}
@keyframes ngRise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root" data-screen-id="PLACE-019"></div>

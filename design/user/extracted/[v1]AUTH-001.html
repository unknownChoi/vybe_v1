<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vybe · 스플래시</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #08070b; font-family: 'Pretendard', -apple-system, sans-serif; }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  *::-webkit-scrollbar { display: none; }
  a { color: #B5FF60; text-decoration: none; }
  a:hover { color: #C8A8FF; }
  /* 조명 기둥 */
  @keyframes spBeamIn { 0% { opacity: 0; } 22% { opacity: calc(var(--op) * 1.5); } 40% { opacity: calc(var(--op) * .35); } 100% { opacity: var(--op); } }
  @keyframes spSwing { from { transform: rotate(var(--from)); } to { transform: rotate(var(--to)); } }
  @keyframes spFlicker { 0%, 92%, 100% { filter: brightness(1); } 94% { filter: brightness(1.55); } 96% { filter: brightness(.7); } }
  @keyframes spHaze { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(4%, 3%, 0) scale(1.08); } }
  @keyframes spPool { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes spDust { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-6%, -14%, 0); } }
  /* 로고 */
  @keyframes spLogo { 0% { opacity: 0; transform: scale(.92) translateY(10px); filter: blur(6px); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes spShine { from { background-position-x: 160%; } to { background-position-x: -60%; } }
  @keyframes spFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spTrack { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }
  /* 홈으로 전환 — 조명이 한 번 밝아졌다 홈 화면 위로 번지며 사그라든다 */
  @keyframes spStageOut { 0% { opacity: 1; transform: scale(1); filter: brightness(1); } 16% { opacity: 1; filter: brightness(1.5); } 100% { opacity: 0; transform: scale(1.1) translateY(-3%); filter: brightness(.85); } }
  @keyframes spGlowOut { 0% { opacity: 0; } 14% { opacity: .7; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="root" data-screen-id="AUTH-001"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="splash.jsx"></script>
</body>
</html>
